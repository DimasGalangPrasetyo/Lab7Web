<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secured SPA Frontend VueJS - MU Forum</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://unpkg.com/vue-router@4/dist/vue-router.global.js"></script>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <div id="app">
        <header class="app-header">
            <p>VueJS + Vue Router + Axios Interceptors + Token API CI4</p>
            <h1>MU Forum SPA Secured</h1>
            <nav class="nav-menu">
                <router-link to="/">Beranda</router-link>
                <router-link to="/artikel">Kelola Artikel</router-link>
                <router-link to="/about">About</router-link>
                <router-link v-if="!isLoggedIn" to="/login">Login</router-link>
                <a v-else href="#" class="logout-link" @click.prevent="logout">Logout</a>
            </nav>
            <small v-if="isLoggedIn" class="auth-status">Status: login sebagai admin SPA</small>
            <small v-else class="auth-status">Status: belum login. Route Artikel dan About diproteksi Navigation Guard.</small>
        </header>

        <main>
            <router-view></router-view>
        </main>
    </div>

    <script src="assets/js/components/Home.js"></script>
    <script src="assets/js/components/Artikel.js"></script>
    <script src="assets/js/components/About.js"></script>
    <script src="assets/js/components/Login.js"></script>
    <script src="assets/js/app.js"></script>
</body>
</html>
